<style>
  html, body { margin: 0; height: 100%; background: #04070f; overflow: hidden; }
  main { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; image-rendering: pixelated; background: #000; }
  #loading { position: fixed; color: #ffcf7a; font: 700 16px system-ui; }
</style>
<script>
/* salvataggi e opzioni separati dagli altri due giochi */
(function () { try { const ls = window.localStorage, P = 'stivale:'; const store = { getItem: (k) => ls.getItem(P + k), setItem: (k, v) => ls.setItem(P + k, v), removeItem: (k) => ls.removeItem(P + k), key: (i) => ls.key(i), get length() { return ls.length; }, clear: () => {} }; Object.defineProperty(window, 'localStorage', { value: store, configurable: true }); } catch (e) {} })();
</script>
